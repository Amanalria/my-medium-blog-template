<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Terms of Service – Medium</title>
    <link rel="canonical" href="/terms">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="theme-bg theme-text font-sans antialiased min-h-screen flex flex-col justify-between">
    <header class="w-full border-b theme-border px-4 sm:px-8 py-3.5 sticky top-0 theme-bg/95 backdrop-blur-md z-40">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="/" class="font-serif font-black text-2xl tracking-tighter theme-text">Medium</a>
            <div class="flex items-center gap-4 text-xs">
                <a href="/" class="theme-muted hover:theme-text">Home</a>
                <a href="/admin" class="px-3.5 py-1.5 rounded-full bg-emerald-600 text-white font-semibold">Write</a>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 py-12 space-y-6 flex-1">
        <h1 class="text-3xl sm:text-4xl font-serif font-bold tracking-tight theme-text">Terms of Service</h1>
        <div class="medium-prose font-serif">
            <p>By accessing and reading articles on our website, you agree to comply with these terms of service.</p>
            <h2>Content Ownership</h2>
            <p>Articles published by respective authors remain the intellectual property of their respective authors.</p>
        </div>
    </main>

    <footer class="border-t theme-border theme-hero-bg w-full py-8 px-4 sm:px-8 text-xs theme-muted text-center">
        © 2026 Medium. All rights reserved.
    </footer>
</body>
</html>
