name: Daily Autonomous Agentic AI Publisher

on:
  schedule:
    # Runs automatically every day at 02:00 AM UTC (07:30 AM IST)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI anytime

permissions:
  contents: write

jobs:
  publish-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Autonomous Agentic AI Publisher
        run: |
          python3 scripts/daily_agentic_autopublisher.py

      - name: Verify Git Status
        run: |
          git status
