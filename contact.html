<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Contact Us</title>
    <meta name="description" content="Get in touch with our editorial and support teams.">
    <link rel="canonical" href="/contact">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }

            try {
                const raw = localStorage.getItem('cached_settings');
                if (raw) {
                    const s = JSON.parse(raw);
                    if (s.site_name) document.title = `Contact Us – ${s.site_name}`;
                    if (s.brand_color) document.documentElement.style.setProperty('--accent-green', s.brand_color);
                    if (s.favicon_url) {
                        let link = document.querySelector("link[rel~='icon']");
                        if (!link) { link = document.createElement('link'); link.rel = 'icon'; document.head.appendChild(link); }
                        link.href = s.favicon_url;
                    }
                }
            } catch(e) {}
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="theme-bg theme-text font-sans antialiased min-h-screen flex flex-col justify-between">
    <header class="w-full border-b theme-border px-4 sm:px-8 py-3.5 sticky top-0 theme-bg/95 backdrop-blur-md z-40">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="/" class="font-serif font-black text-2xl tracking-tighter theme-text site-logo-text"><script>(function(){try{const c=localStorage.getItem('cached_settings');document.write(c?JSON.parse(c).site_name||'Medium':'Medium');}catch(e){document.write('Medium');}})();</script></a>
            <div class="flex items-center gap-4 text-xs">
                <a href="/" class="theme-muted hover:theme-text">Home</a>
            </div>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-4 sm:px-6 py-12 space-y-6 flex-1 w-full">
        <h1 class="text-3xl sm:text-4xl font-serif font-bold tracking-tight theme-text">Contact Us</h1>
        <p class="text-xs theme-muted">Have a question or feedback? Send us a message below.</p>
        <form onsubmit="event.preventDefault(); alert('Message received. Thank you!'); this.reset();" class="space-y-4 pt-2">
            <div class="space-y-1">
                <label class="text-xs font-semibold theme-text">Your Name</label>
                <input type="text" required class="w-full theme-bg border theme-border theme-text text-xs p-3 rounded-xl focus:outline-none focus:border-zinc-400">
            </div>
            <div class="space-y-1">
                <label class="text-xs font-semibold theme-text">Email Address</label>
                <input type="email" required class="w-full theme-bg border theme-border theme-text text-xs p-3 rounded-xl focus:outline-none focus:border-zinc-400">
            </div>
            <div class="space-y-1">
                <label class="text-xs font-semibold theme-text">Message</label>
                <textarea rows="4" required class="w-full theme-bg border theme-border theme-text text-xs p-3 rounded-xl focus:outline-none focus:border-zinc-400"></textarea>
            </div>
            <button type="submit" class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs shadow-sm">
                Send Message
            </button>
        </form>
    </main>

    <footer class="border-t theme-border theme-hero-bg w-full py-8 px-4 sm:px-8 text-xs theme-muted text-center site-copyright-text">
        <script>(function(){try{const c=localStorage.getItem('cached_settings');document.write(c?JSON.parse(c).footer_copyright||'© 2026. All rights reserved.':'© 2026. All rights reserved.');}catch(e){document.write('© 2026. All rights reserved.');}})();</script>
    </footer>
</body>
</html>
